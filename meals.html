<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Track your Indian meals and count carbohydrates with GlucoGuard-T1D. Search roti, dal, biryani and more." />
<meta name="theme-color" content="#2563eb" />
<title>Meals — GlucoGuard-T1D</title>
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
<noscript>GlucoGuard-T1D requires JavaScript. Please enable it in your browser.</noscript>
<div class="app-shell">
  <div id="app-nav"></div>
  <main class="app-main">
    <div class="page-header">
      <div>
        <span class="eyebrow">Meals</span>
        <h1>Carb Counting</h1>
        <p>Built for everyday Indian meals — search, add, and save.</p>
      </div>
      <a href="scan.html" class="btn btn-secondary">📷 Scan Food instead</a>
    </div>

    <div class="grid grid-2">
      <div class="card">
        <div class="card-title">Search Foods</div>
        <div class="field"><input type="text" id="food-search-input" placeholder="Try roti, dal, dosa, biryani…" /></div>
        <ul id="food-results" style="max-height:320px; overflow:auto;"></ul>
      </div>

      <div class="card">
        <div class="card-title">This Meal</div>
        <ul id="selected-items"></ul>
        <div class="divider"></div>
        <div id="meal-totals" style="margin-bottom:14px; font-size:14px;"></div>
        <div class="field">
          <label for="meal-type-select">Meal type</label>
          <select id="meal-type-select">
            <option value="">Select…</option>
            <option value="breakfast">Breakfast</option>
            <option value="lunch">Lunch</option>
            <option value="dinner">Dinner</option>
            <option value="snack">Snack</option>
          </select>
        </div>
        <div class="field">
          <label for="meal-time">Meal time</label>
          <input type="datetime-local" id="meal-time" />
        </div>
        <button id="save-meal-btn" class="btn btn-primary btn-block" type="button">Save Meal</button>
      </div>
    </div>

    <div class="card" style="margin-top:20px;">
      <div class="card-title">Recent Meals</div>
      <ul id="meal-history-list"></ul>
    </div>
  </main>
</div>
<script type="module" src="js/meals.js"></script>
</body>
</html>
